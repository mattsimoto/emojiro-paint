name: Validate Emojiro Paint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check tests/validate.mjs
          node --check sw.js

      - name: Run DOM and selector smoke validation
        run: node tests/validate.mjs

      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f paint-plus.css
          test -f composer.css
          test -f project-library.css
          test -f app.js
          test -f manifest.webmanifest
          test -f favicon.svg
          test -f sw.js
