name: Validate Emojiro Paint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check tests/validate.mjs
          node --check tests/browser-smoke.mjs
          node --check sw.js

      - name: Run DOM and selector smoke validation
        run: node tests/validate.mjs

      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f paint-plus.css
          test -f composer.css
          test -f project-library.css
          test -f toybox.css
          test -f upcycle-theme.css
          test -f app.js
          test -f manifest.webmanifest
          test -f favicon.svg
          test -f sw.js
          test -f supabase-cloud-sync.sql
          test -f tests/browser-smoke.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Emojiro Paint
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/emojiro-server.log 2>&1 &
          echo $! > /tmp/emojiro-server.pid
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/ > /dev/null

      - name: Run Chromium browser smoke test
        run: node tests/browser-smoke.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/emojiro-server.log || true
